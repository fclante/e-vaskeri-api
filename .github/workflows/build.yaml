name: Deploy E-Vaskeri API

on:
  # push:
  #   paths:
  #     - "release/**"
  #   paths-ignore:
  #     - "test/**"
  #   branches:
  #     - main

  workflow_dispatch:

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: tibdex/github-app-token@v1
        id: get_installation_token
        with:
          app_id: ${{ vars.CI_APP_ID }}
          installation_id: ${{ vars.CI_INSTALLATION_ID }} # installation_id needed so we dont have to install app on the current repo
          private_key: ${{ secrets.CI_TOKEN }}

      - name: Log into registry
        if: github.actor != 'dependabot[bot]'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          push: ${{ github.actor != 'dependabot[bot]' }}
          context: .
          build-args: |
            version=${{ matrix.builds.tag }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          tags: ${{ matrix.builds.endpoint }}/${{ matrix.builds.image_REPLACE_ME }}:${{ matrix.builds.tag__REPLACE_ME }}
