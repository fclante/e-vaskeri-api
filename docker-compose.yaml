services:
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      E_VASKERI_USERNAME: ${E_VASKERI_USERNAME:?set E_VASKERI_USERNAME in .env}
      E_VASKERI_PASSWORD: ${E_VASKERI_PASSWORD:?set E_VASKERI_PASSWORD in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
